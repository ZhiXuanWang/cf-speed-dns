    <style>

        .centered-div { font-size: 15px; font-weight: bold; text-align: center; }
        th, td { padding: 10px; text-align: center; border: 1px solid #ddd; }

        .recommended { font-weight: bold; color: #FF5722; }

        .speed { color: green; font-weight: bold; }
        .mobile-label { display: none; }

            tbody { display: block; }
            tbody tr {

                margin-bottom: 8px;
                border: 1px solid #ddd;
                background: #fff;
            }
            tbody td { display: block; grid-column: span 3; min-width: 0; padding: 7px 4px; border: 0; font-size: 14px; }
            .recommended, .speed {
                display: flex;
                grid-row: 1;
                align-items: center;
                padding: 4px 8px;
                border-bottom: 1px solid #ddd;
                background: #f8f8f8;
                white-space: nowrap;
            }
            .recommended { grid-column: 1 / span 8; gap: 4px; }
            .speed { grid-column: 9 / -1; justify-content: flex-end; }
            .highlight-icon { flex: none; color: #1E9FFF; font-size: 16px; line-height: 1; }
            .copy-btn { min-height: 32px; margin-left: 0; padding: 0 4px; white-space: nowrap; }
            .mobile-label { display: block; margin-bottom: 2px; color: #595959; font-size: 12px; }
            .measured-at { grid-column: 1 / -1; border-top: 1px solid #eee; color: #595959; font-size: 12px; }

<script>
    function copyIP(ip) {
        navigator.clipboard.writeText(ip).then(function() {
            alert('已复制: ' + ip);
        }).catch(function() {
            var textArea = document.createElement('textarea');
            textArea.value = ip;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            alert('已复制: ' + ip);
        });
    }
</script>
